services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: plot
      POSTGRES_PASSWORD: plot
      POSTGRES_DB: plot
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Inngest dev server: durable workflow engine (timers / vote-waits / auto-lock).
  # It discovers functions by polling the API's /api/inngest endpoint.
  inngest:
    image: inngest/inngest:latest
    command: ["inngest", "dev", "-u", "http://host.docker.internal:3000/api/inngest"]
    ports: ["8288:8288"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [postgres, redis]

  # Stripe's OFFICIAL local server — the real Stripe Node SDK talks to it over the real Stripe API
  # with NO paid account/key. PAYMENT_PROVIDER=stripe + STRIPE_API_BASE=http://localhost:12111.
  stripe-mock:
    image: stripe/stripe-mock:latest
    ports: ["12111:12111", "12112:12112"]

  # Mailpit — a real SMTP server + inbox UI. SmtpComms sends real email over SMTP (no account).
  # COMMS_PROVIDER=smtp; non-user invites are delivered for real and viewable at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
