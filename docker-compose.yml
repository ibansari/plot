services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: plot
      POSTGRES_PASSWORD: plot
      POSTGRES_DB: plot
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Inngest dev server: durable workflow engine (timers / vote-waits / auto-lock).
  # It discovers functions by polling the API's /api/inngest endpoint.
  inngest:
    image: inngest/inngest:latest
    command: ["inngest", "dev", "-u", "http://host.docker.internal:3000/api/inngest"]
    ports: ["8288:8288"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [postgres, redis]

volumes:
  pgdata:
