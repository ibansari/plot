[project]
name = "plot-agent"
version = "0.1.0"
description = "PLOT agent — FastAPI + LangGraph planning agent (Claude tool-use, deterministic fallback)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "langgraph>=0.2.28",
  "langchain-core>=0.3",
  "anthropic>=0.39",
]

[project.optional-dependencies]
# Postgres checkpointer for LangGraph (falls back to in-memory if absent).
postgres = ["langgraph-checkpoint-postgres>=2.0", "psycopg[binary]>=3.2"]
# MCP client — connect Google Calendar / Maps / Resy etc. as gated loop tools (see mcp_bridge.py).
mcp = ["mcp>=1.2"]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plot_agent"]
